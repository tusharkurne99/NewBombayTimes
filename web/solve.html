<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Bombay Times: Solve</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .m-title { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .m-title b { font-family: var(--font-display); font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-title span { font-size: 11px; color: rgba(247,244,238,.6); white-space: nowrap; }
  .m-right { display: flex; align-items: center; gap: 6px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; padding: 6px 10px; border-radius: 6px; min-width: 62px; text-align: center; }

  /* Switcher + toolbar are wrapped in one sticky bar (below) so they can
     never scroll out of reach, whatever the cause -- a tall clue list, a
     long puzzle, a future page addition. */
  .controls-bar { position: sticky; top: 56px; z-index: 15; background: var(--bg); }

  .switcher { display: flex; justify-content: center; gap: 8px; padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--surface-border); }
  .switcher button { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text-muted); padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .switcher button.active { background: var(--badge-bg); color: var(--badge-text); border-color: var(--badge-bg); }

  .toolbar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--surface-border); }
  .tool-btn { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--surface-border); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--surface-border); color: var(--text-muted); }

  /* Check/Reveal are dropdowns (Square/Word/Puzzle) rather than 6 separate
     pills -- keeps the toolbar to 3 items on one line while still giving
     a newbie the option to check/reveal at whatever granularity they want. */
  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 6px; min-width: 160px; z-index: 25;
    display: none; flex-direction: column; gap: 2px;
  }
  .dropdown-menu.open { display: flex; }
  .dropdown-menu button {
    background: none; border: none; text-align: left; padding: 8px 10px; border-radius: 6px;
    font-size: 13px; color: var(--text); cursor: pointer; width: 100%;
  }
  .dropdown-menu button:hover { background: var(--surface-2); }
  .dropdown-menu button:disabled { opacity: .45; cursor: not-allowed; }

  .stage { display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 8px 16px 60px; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
  .board-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .active-clue { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 6px; width: 100%; max-width: 560px; }
  .active-clue button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; display: flex; flex: none; }
  .active-clue button:hover { color: var(--accent); }
  .active-clue .txt { flex: 1; text-align: center; font-size: 15px; }
  .active-clue .num { font-weight: 700; margin-right: 6px; }

  .grid-wrap { background: var(--text); padding: 2px; border-radius: 4px; box-shadow: var(--shadow); position: relative; }
  .grid-wrap.locked .xgrid { opacity: .45; pointer-events: none; }
  .grid-wrap.locked::after {
    content: "Paused"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--surface);
    text-shadow: 0 1px 3px rgba(0,0,0,.4); letter-spacing: .5px; pointer-events: none;
  }
  .xgrid { display: grid; gap: 2px; }
  #mobile-input {
    position: absolute; opacity: 0; border: 0; padding: 0; margin: 0;
    /* font-size 16px+ stops iOS Safari auto-zooming the page on focus */
    font-size: 16px; caret-color: transparent; pointer-events: none;
  }
  .xcell { position: relative; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
  .xcell.black { background: var(--text); cursor: default; }
  .xcell .num { position: absolute; top: 1px; left: 2px; font-size: calc(var(--cell) * 0.24); font-weight: 700; color: var(--text-muted); line-height: 1; }
  .xcell .ltr { font-family: var(--font-sans); font-weight: 600; color: var(--text); font-size: calc(var(--cell) * 0.52); text-transform: uppercase; }
  .xcell.in-word { background: var(--surface-2); }
  .xcell.selected { background: var(--cell-selected); }
  .xcell.wrong .ltr { color: var(--err); }

  .clue-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; max-width: 460px; }
  .clue-col h3 { font-family: var(--font-display); font-size: 14px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); border-bottom: 1px solid var(--surface-border); padding-bottom: 6px; }
  .clue-col ol { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  .clue-col li { display: flex; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.35; }
  .clue-col li:hover { background: var(--surface-2); }
  .clue-col li.active { background: var(--surface-2); font-weight: 600; }
  .clue-col li .n { color: var(--text-muted); flex: none; min-width: 18px; }
  @media (max-width: 760px) { .clue-lists { display: none; } }

  .load-msg { text-align: center; padding: 60px 20px; color: var(--text-muted); }

  /* The completion/reveal panel is a non-blocking corner toast, not a
     centered modal -- revealing or finishing a puzzle shouldn't hide the
     grid behind a dark scrim (there's no reason to block it: closing the
     panel is meant to let you look at or clear the grid immediately). The
     username entry overlay keeps the original full-screen blocking
     behavior (id="name-overlay", untouched) since that one genuinely must
     be dealt with before solving can start. */
  #done-overlay { background: transparent; justify-content: flex-end; align-items: flex-end; padding: 20px; pointer-events: none; }
  #done-overlay .modal { pointer-events: auto; max-width: 300px; padding: 22px 20px; text-align: left; position: relative; }
  #done-overlay .modal .arch { margin: 0 0 10px; }
  #done-overlay .modal h2 { font-size: 19px; }
  #done-overlay .done-time { font-size: 30px; }
  #done-close-x {
    position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 4px; display: flex; border-radius: 6px;
  }
  #done-close-x:hover { color: var(--text); background: var(--surface-2); }
</style>
</head>
<body>

<header class="masthead">
  <div class="m-left">
    <a class="icon-btn" href="index.html" aria-label="Back to puzzles" title="Back to puzzles">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <svg class="wordmark-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="var(--masthead-text)" d="M4 21 V10 C4 5.02 7.58 2 12 2 C16.42 2 20 5.02 20 10 V21 Z"/>
      <path fill="var(--masthead-bg)" d="M8 21 V11.5 C8 8.5 9.8 6.5 12 6.5 C14.2 6.5 16 8.5 16 11.5 V21 Z"/>
    </svg>
    <div class="m-title">
      <b id="puzzle-title">Loading…</b>
      <span id="puzzle-date"></span>
    </div>
  </div>
  <div class="m-right">
    <button class="icon-btn" id="pause-btn" aria-label="Pause timer" title="Pause">
      <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
      <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"></path></svg>
    </button>
    <span class="timer" id="timer">0:00</span>
  </div>
</header>

<div class="controls-bar">
  <div class="switcher">
    <button data-size="mini">Mini</button>
    <button data-size="midi">Midi</button>
    <button data-size="crossword">Crossword</button>
  </div>

  <div class="toolbar">
    <div class="dropdown">
      <button class="tool-btn" id="check-toggle" aria-haspopup="true" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
        Check
      </button>
      <div class="dropdown-menu" id="check-menu">
        <button id="check-square-btn">Check Square</button>
        <button id="check-word-btn">Check Word</button>
        <button id="check-puzzle-btn">Check Puzzle</button>
      </div>
    </div>
    <div class="dropdown">
      <button class="tool-btn" id="reveal-toggle" aria-haspopup="true" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        Reveal
      </button>
      <div class="dropdown-menu" id="reveal-menu">
        <button id="reveal-square-btn">Reveal Square</button>
        <button id="reveal-word-btn">Reveal Word</button>
        <button id="reveal-puzzle-btn">Reveal Puzzle</button>
      </div>
    </div>
    <button class="tool-btn" id="clear-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      Clear
    </button>
  </div>
</div>

<div id="stage-wrap">
  <div class="load-msg" id="load-msg">Loading today's puzzle…</div>
  <div class="stage" id="stage" style="display:none">
    <div class="board-col">
      <div class="active-clue">
        <button id="prev-clue" aria-label="Previous clue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="txt"><span class="num" id="active-num">1-Across</span><span id="active-text">Loading…</span></div>
        <button id="next-clue" aria-label="Next clue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="grid-wrap">
        <div class="xgrid" id="grid"></div>
        <!-- Invisible, focusable input -- the standard way to get the
             device's OWN keyboard to pop up on tap, same trick a search
             box uses. No custom on-screen keyboard is built; this input
             is just what the OS keyboard actually types into, positioned
             over the selected cell (see positionMobileInput()) so iOS
             doesn't jump-scroll the page when it opens. -->
        <input id="mobile-input" type="text" inputmode="text" maxlength="1"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               aria-hidden="true" tabindex="-1">
      </div>
    </div>
    <div class="clue-lists">
      <div class="clue-col"><h3>Across</h3><ol id="list-across"></ol></div>
      <div class="clue-col"><h3>Down</h3><ol id="list-down"></ol></div>
    </div>
  </div>
</div>

<!-- Username modal -->
<div class="overlay" id="name-overlay">
  <div class="modal">
    <svg class="arch" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="margin:0 auto 14px;">
      <path fill="var(--text)" d="M4 21 V10 C4 5.02 7.58 2 12 2 C16.42 2 20 5.02 20 10 V21 Z"/>
      <path fill="var(--surface)" d="M8 21 V11.5 C8 8.5 9.8 6.5 12 6.5 C14.2 6.5 16 8.5 16 11.5 V21 Z"/>
    </svg>
    <h2>Before you start…</h2>
    <p>Pick a name for today's board. Anything goes, no account needed, as long as it's unique for today.</p>
    <input id="name-input" type="text" placeholder="e.g. chai_before_coffee" maxlength="24" autocomplete="off">
    <button class="primary-btn" id="name-submit">Start solving</button>
  </div>
</div>

<!-- Completion/reveal panel: a non-blocking corner toast, not a centered
     modal that hides the grid behind it. The X just dismisses it (the
     grid keeps whatever state it was in -- solved or revealed -- so you
     can still hit Clear and try again if you want). "Back to Home"
     actually leaves, since there's no reason to linger on a puzzle you've
     already finished or revealed. -->
<div class="overlay hidden" id="done-overlay">
  <div class="modal">
    <button id="done-close-x" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <svg class="arch" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="var(--text)" d="M4 21 V10 C4 5.02 7.58 2 12 2 C16.42 2 20 5.02 20 10 V21 Z"/>
      <path fill="var(--surface)" d="M8 21 V11.5 C8 8.5 9.8 6.5 12 6.5 C14.2 6.5 16 8.5 16 11.5 V21 Z"/>
    </svg>
    <h2 id="done-heading">Solved!</h2>
    <div class="done-time" id="done-time">0:00</div>
    <div class="done-rank" id="done-rank">Rank — of —</div>
    <div class="mini-lb" id="done-lb"></div>
    <button class="primary-btn" id="done-home">Back to Home</button>
  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<!-- ?v= is a manually-bumped cache-buster -- bump it any time
     leaderboard.js changes. See the matching comment in index.html for
     why: a stale cached copy from before the Firestore rewrite kept
     running after the file changed on disk, breaking the new
     .then()-based caller code with "not a function". -->
<script type="module" src="assets/leaderboard.js?v=2026-08-19-1"></script>
<script src="assets/confetti.js"></script>
<script>
var TITLES = { mini: 'The Mini', midi: 'The Midi', crossword: 'The Crossword' };
var PUZZLE_CACHE = {};

var state = {
  size: 'mini',
  puzzle: null,
  slots: { across: [], down: [] },
  cellSlot: {},
  values: [],
  sel: { r: 0, c: 0 },
  dir: 'across',
  timerStart: null,
  elapsedBeforePause: 0,
  paused: false,
  running: false,
  username: null,
  finished: false,
  // True once any Reveal action (square/word/puzzle) has been used this
  // attempt. A completion reached after a reveal doesn't count as a real
  // solve -- see finishPuzzle()/checkCompletion() -- otherwise revealing
  // most of the grid then typing the last letter yourself would still
  // land you on the leaderboard.
  usedReveal: false
};

function fmtDate(iso) {
  var parts = iso.split('-').map(Number);
  var d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
}

function fetchPuzzle(size) {
  if (PUZZLE_CACHE[size]) return Promise.resolve(PUZZLE_CACHE[size]);
  // Cache-busting query param: GitHub Pages' CDN sends cacheable headers
  // for static files by default, and fetch() honors that -- without this,
  // a browser that already loaded today's puzzle once can keep serving it
  // from cache even after publish.sh has genuinely overwritten the file
  // with a new day's data (this is exactly what happened in practice: a
  // hard refresh was needed to see Aug 13's puzzle after Sunday's had
  // been cached). Date.now() forces a fresh network request every time
  // rather than trying to guess a "once per day" cutoff against the
  // visitor's own clock, which is one more thing that could be wrong.
  // These files are a few KB -- there's no real cost to never caching them.
  return fetch('data/puzzles/latest_' + size + '.json?v=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('Puzzle not found for ' + size);
      return r.json();
    })
    .then(function (data) { PUZZLE_CACHE[size] = data; return data; });
}

function buildSlots(grid, numbering) {
  var rows = grid.length, cols = grid[0].length;
  var across = [], down = [];
  for (var r = 0; r < rows; r++) {
    var c = 0;
    while (c < cols) {
      if (grid[r][c] === '#') { c++; continue; }
      var start = c, cells = [];
      while (c < cols && grid[r][c] !== '#') { cells.push([r, c]); c++; }
      if (cells.length >= 2) across.push({ number: numbering[r + ',' + start], cells: cells });
    }
  }
  for (var c = 0; c < cols; c++) {
    var r = 0;
    while (r < rows) {
      if (grid[r][c] === '#') { r++; continue; }
      var start = r, cells = [];
      while (r < rows && grid[r][c] !== '#') { cells.push([r, c]); r++; }
      if (cells.length >= 2) down.push({ number: numbering[start + ',' + c], cells: cells });
    }
  }
  across.sort(function (a, b) { return a.number - b.number; });
  down.sort(function (a, b) { return a.number - b.number; });

  var cellSlot = {};
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) cellSlot[r + ',' + c] = { across: -1, down: -1 };
  across.forEach(function (s, i) { s.cells.forEach(function (rc) { cellSlot[rc[0] + ',' + rc[1]].across = i; }); });
  down.forEach(function (s, i) { s.cells.forEach(function (rc) { cellSlot[rc[0] + ',' + rc[1]].down = i; }); });

  return { across: across, down: down, cellSlot: cellSlot };
}

function loadPuzzle(size) {
  document.getElementById('load-msg').style.display = '';
  document.getElementById('load-msg').textContent = "Loading today's puzzle…";
  document.getElementById('stage').style.display = 'none';

  fetchPuzzle(size).then(function (puzzle) {
    state.size = size;
    state.puzzle = puzzle;
    var built = buildSlots(puzzle.grid, puzzle.numbering);
    state.slots = built; state.cellSlot = built.cellSlot;

    var rows = puzzle.size.rows, cols = puzzle.size.cols;
    state.values = [];
    for (var r = 0; r < rows; r++) { var row = []; for (var c = 0; c < cols; c++) row.push(''); state.values.push(row); }

    outer:
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (puzzle.grid[r][c] !== '#') { state.sel = { r: r, c: c }; break outer; }
    }
    state.dir = 'across';
    state.finished = false;
    state.usedReveal = false;

    document.getElementById('puzzle-title').textContent = TITLES[size];
    document.getElementById('puzzle-date').textContent = fmtDate(puzzle.date);
    document.querySelectorAll('.switcher button').forEach(function (b) { b.classList.toggle('active', b.dataset.size === size); });

    renderGrid();
    renderClueLists();
    updateActiveClue();
    resetTimer();

    document.getElementById('load-msg').style.display = 'none';
    document.getElementById('stage').style.display = 'flex';

    var url = new URL(window.location);
    url.searchParams.set('size', size);
    window.history.replaceState({}, '', url);
  }).catch(function (err) {
    document.getElementById('load-msg').textContent =
      "Couldn't load today's " + TITLES[size] + ". Has run_daily.sh + publish.sh run yet?";
  });
}

function cellSize(cols) {
  var maxW = Math.min(window.innerWidth - 32, 520);
  var s = Math.floor(maxW / cols);
  return Math.max(22, Math.min(56, s));
}

function renderGrid() {
  var grid = state.puzzle.grid;
  var rows = grid.length, cols = grid[0].length;
  var el = document.getElementById('grid');
  el.innerHTML = '';
  var cs = cellSize(cols);
  el.style.setProperty('--cell', cs + 'px');
  el.style.gridTemplateColumns = 'repeat(' + cols + ', var(--cell))';
  el.style.gridTemplateRows = 'repeat(' + rows + ', var(--cell))';

  // Fix .board-col's width to the grid's actual rendered pixel width
  // (cells + inter-cell gaps + the grid-wrap frame's own padding/border).
  // Without this, .board-col has no explicit width -- it's sized by its
  // widest child, and .active-clue (width:100%) has genuinely ambiguous
  // sizing in that situation. Longer/shorter clue text was shifting
  // .board-col's effective width by a few pixels, which was enough to
  // push the whole .stage row across its flex-wrap threshold on SOME
  // clues and not others -- the grid+clue-lists layout flipped between
  // side-by-side and stacked abruptly as you navigated clues, for no
  // reason a solver could see. Fixing this width once per puzzle load
  // makes the wrap decision depend only on window size, never clue text.
  var gridPixelWidth = cs * cols + 2 * (cols - 1) + 4; // gaps (2px) + grid-wrap padding (2px each side)
  document.querySelector('.board-col').style.width = gridPixelWidth + 'px';

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var div = document.createElement('div');
      div.className = 'xcell';
      div.dataset.r = r; div.dataset.c = c;
      if (grid[r][c] === '#') {
        div.classList.add('black');
      } else {
        var num = state.puzzle.numbering[r + ',' + c];
        if (num) { var ns = document.createElement('span'); ns.className = 'num'; ns.textContent = num; div.appendChild(ns); }
        var ls = document.createElement('span'); ls.className = 'ltr';
        div.appendChild(ls);
        div.addEventListener('click', function () { selectCell(+this.dataset.r, +this.dataset.c, true); });
      }
      el.appendChild(div);
    }
  }
  paintGrid();
}

function paintGrid() {
  var el = document.getElementById('grid');
  var cur = currentSlot();
  el.querySelectorAll('.xcell').forEach(function (div) {
    if (div.classList.contains('black')) return;
    var r = +div.dataset.r, c = +div.dataset.c;
    div.classList.remove('in-word', 'selected', 'wrong');
    var ltr = div.querySelector('.ltr');
    ltr.textContent = state.values[r][c] || '';
    if (cur && cur.cells.some(function (rc) { return rc[0] === r && rc[1] === c; })) div.classList.add('in-word');
    if (r === state.sel.r && c === state.sel.c) div.classList.add('selected');
  });
}

function currentSlot() {
  var cs = state.cellSlot[state.sel.r + ',' + state.sel.c];
  if (!cs) return null;
  var idx = state.dir === 'across' ? cs.across : cs.down;
  if (idx === -1) {
    idx = state.dir === 'across' ? cs.down : cs.across;
    if (idx === -1) return null;
    state.dir = state.dir === 'across' ? 'down' : 'across';
  }
  return state.slots[state.dir][idx];
}

function selectCell(r, c, toggle) {
  if (state.paused) return; // grid-wrap's pointer-events:none already blocks the click, this is belt-and-suspenders
  if (state.puzzle.grid[r][c] === '#') return;
  var cs = state.cellSlot[r + ',' + c];
  if (toggle && r === state.sel.r && c === state.sel.c) {
    var other = state.dir === 'across' ? 'down' : 'across';
    if ((other === 'down' ? cs.down : cs.across) !== -1) state.dir = other;
  } else {
    if (state.dir === 'across' && cs.across === -1 && cs.down !== -1) state.dir = 'down';
    if (state.dir === 'down' && cs.down === -1 && cs.across !== -1) state.dir = 'across';
  }
  state.sel = { r: r, c: c };
  paintGrid(); updateActiveClue(); startTimerIfNeeded();
  focusMobileInput();
}

// Positions the hidden input exactly over the selected cell (so iOS
// doesn't jump-scroll the page to bring a focused input into view --
// it's already where the action is) and focuses it, which is what
// actually triggers the device's own keyboard. Has to be called
// synchronously from a real click/tap handler -- browsers (iOS Safari
// especially) refuse to open the keyboard for a focus() call that isn't
// directly inside a user-gesture event handler.
function focusMobileInput() {
  var input = document.getElementById('mobile-input');
  var cellEl = document.querySelector('.xcell.selected');
  if (cellEl) {
    input.style.left = cellEl.offsetLeft + 'px';
    input.style.top = cellEl.offsetTop + 'px';
    input.style.width = cellEl.offsetWidth + 'px';
    input.style.height = cellEl.offsetHeight + 'px';
  }
  input.value = '';
  input.focus();
}

function clueFor(dir, number) { return state.puzzle.clues[dir][String(number)]; }

function updateActiveClue() {
  var slot = currentSlot();
  if (!slot) return;
  var clue = clueFor(state.dir, slot.number);
  document.getElementById('active-num').textContent = slot.number + '-' + (state.dir === 'across' ? 'Across' : 'Down');
  document.getElementById('active-text').textContent = clue ? clue.clue : '';
  document.querySelectorAll('.clue-col li').forEach(function (li) {
    li.classList.toggle('active', li.dataset.dir === state.dir && +li.dataset.num === slot.number);
  });
  var activeLi = document.querySelector('.clue-col li.active');
  if (activeLi) scrollWithinList(activeLi);
}

// Deliberately NOT using Element.scrollIntoView() here: when the clue
// list is short enough to need no internal scrolling of its own (true
// for every Mini clue list, and often Midi), the browser escalates the
// scroll request to the outer PAGE instead, since there's nothing to
// scroll internally -- the whole page jumps on every clue change, even
// though the clue was already fully visible. Scoping the scroll to just
// the list's own scrollTop guarantees the page itself never moves.
function scrollWithinList(el) {
  var container = el.parentElement; // the <ol>
  if (!container) return;
  var elTop = el.offsetTop, elBottom = elTop + el.offsetHeight;
  var viewTop = container.scrollTop, viewBottom = viewTop + container.clientHeight;
  if (elTop < viewTop) container.scrollTop = elTop;
  else if (elBottom > viewBottom) container.scrollTop = elBottom - container.clientHeight;
}

function renderClueLists() {
  ['across', 'down'].forEach(function (dir) {
    var ol = document.getElementById('list-' + dir);
    ol.innerHTML = '';
    state.slots[dir].forEach(function (slot) {
      var clue = clueFor(dir, slot.number);
      if (!clue) return;
      var li = document.createElement('li');
      li.dataset.dir = dir; li.dataset.num = slot.number;
      li.innerHTML = '<span class="n">' + slot.number + '.</span><span>' + clue.clue + '</span>';
      li.addEventListener('click', function () {
        state.dir = dir;
        state.sel = { r: slot.cells[0][0], c: slot.cells[0][1] };
        paintGrid(); updateActiveClue(); startTimerIfNeeded();
      });
      ol.appendChild(li);
    });
  });
}

function moveToNextCellInSlot() {
  var slot = currentSlot();
  if (!slot) return;
  var idx = slot.cells.findIndex(function (rc) { return rc[0] === state.sel.r && rc[1] === state.sel.c; });
  if (idx > -1 && idx < slot.cells.length - 1) {
    state.sel = { r: slot.cells[idx + 1][0], c: slot.cells[idx + 1][1] };
  } else { jumpToAdjacentSlot(1); return; }
  paintGrid(); updateActiveClue();
}

function moveToPrevCellInSlot() {
  var slot = currentSlot();
  if (!slot) return;
  var idx = slot.cells.findIndex(function (rc) { return rc[0] === state.sel.r && rc[1] === state.sel.c; });
  if (idx > 0) { state.sel = { r: slot.cells[idx - 1][0], c: slot.cells[idx - 1][1] }; paintGrid(); updateActiveClue(); }
}

function flatSlotList() {
  var flat = [];
  state.slots.across.forEach(function (s) { flat.push({ dir: 'across', slot: s }); });
  state.slots.down.forEach(function (s) { flat.push({ dir: 'down', slot: s }); });
  flat.sort(function (a, b) { return a.slot.number - b.slot.number || (a.dir < b.dir ? -1 : 1); });
  return flat;
}

function jumpToAdjacentSlot(delta) {
  var flat = flatSlotList();
  var curIdx = flat.findIndex(function (f) { return f.dir === state.dir && f.slot.number === currentSlot().number; });
  var nextIdx = (curIdx + delta + flat.length) % flat.length;
  var next = flat[nextIdx];
  state.dir = next.dir;
  state.sel = { r: next.slot.cells[0][0], c: next.slot.cells[0][1] };
  paintGrid(); updateActiveClue();
}

function handleArrow(key) {
  var r = state.sel.r, c = state.sel.c;
  var grid = state.puzzle.grid, rows = grid.length, cols = grid[0].length;
  var dr = 0, dc = 0;
  if (key === 'ArrowRight') { dc = 1; state.dir = 'across'; }
  if (key === 'ArrowLeft') { dc = -1; state.dir = 'across'; }
  if (key === 'ArrowDown') { dr = 1; state.dir = 'down'; }
  if (key === 'ArrowUp') { dr = -1; state.dir = 'down'; }
  var nr = r + dr, nc = c + dc;
  while (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === '#') { nr += dr; nc += dc; }
  if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] !== '#') { state.sel = { r: nr, c: nc }; paintGrid(); updateActiveClue(); }
}

// Shared by both entry paths (physical keyboard's keydown below, and the
// mobile-input's 'input' event further down) so a letter/backspace does
// exactly the same thing regardless of which keyboard produced it.
function fillCurrentCell(letter) {
  state.values[state.sel.r][state.sel.c] = letter;
  paintGrid(); startTimerIfNeeded(); moveToNextCellInSlot(); checkCompletion();
}
function backspaceCurrentCell() {
  if (state.values[state.sel.r][state.sel.c]) { state.values[state.sel.r][state.sel.c] = ''; paintGrid(); }
  else { moveToPrevCellInSlot(); state.values[state.sel.r][state.sel.c] = ''; paintGrid(); }
}

document.addEventListener('keydown', function (e) {
  if (!document.getElementById('name-overlay').classList.contains('hidden')) return;
  if (state.finished || !state.puzzle || state.paused) return;
  var key = e.key;
  // Letters/backspace are skipped here when the hidden mobile-input has
  // focus -- it's a real <input>, so typing into it (physical keyboard
  // OR the device's on-screen one) also fires a native 'input' event,
  // handled below. Without this guard, a physical keyboard would double-
  // process every letter once a cell had been tapped (mobile-input
  // focused) and then typed on directly (e.g. testing on a laptop with a
  // touchscreen, or just clicking a cell then typing).
  var viaMobileInput = e.target === document.getElementById('mobile-input');
  if (/^[a-zA-Z]$/.test(key)) {
    if (!viaMobileInput) fillCurrentCell(key.toUpperCase());
    e.preventDefault();
  } else if (key === 'Backspace') {
    if (!viaMobileInput) backspaceCurrentCell();
    e.preventDefault();
  } else if (key.indexOf('Arrow') === 0) { handleArrow(key); e.preventDefault(); }
  else if (key === 'Tab') { jumpToAdjacentSlot(e.shiftKey ? -1 : 1); e.preventDefault(); }
  else if (key === ' ') { selectCell(state.sel.r, state.sel.c, true); e.preventDefault(); }
});

// What actually receives characters from a mobile on-screen keyboard.
// Deliberately NOT reading e.key/keydown for this -- many mobile
// keyboards (Android's predictive/Gboard-style ones especially) don't
// send usable keydown events at all (key comes through as "Unidentified"
// / keyCode 229, a long-standing, well-known IME quirk). The 'input'
// event and its value are the only reliable source of what was actually
// typed on those keyboards.
document.getElementById('mobile-input').addEventListener('input', function (e) {
  if (!document.getElementById('name-overlay').classList.contains('hidden')) return;
  if (state.finished || !state.puzzle || state.paused) return;

  if (e.inputType && e.inputType.indexOf('delete') === 0) {
    backspaceCurrentCell();
  } else {
    // Take the last character typed rather than assuming exactly one --
    // covers autocomplete/predictive-text insertions that could land
    // more than one character in a single input event despite maxlength.
    var letter = this.value.slice(-1);
    if (/^[a-zA-Z]$/.test(letter)) fillCurrentCell(letter.toUpperCase());
  }
  this.value = '';
});

document.getElementById('prev-clue').addEventListener('click', function () { jumpToAdjacentSlot(-1); });
document.getElementById('next-clue').addEventListener('click', function () { jumpToAdjacentSlot(1); });

/* ------------------------------- Timer ------------------------------- */
var timerInterval = null;
function resetTimer() {
  clearInterval(timerInterval);
  state.timerStart = null; state.elapsedBeforePause = 0; state.paused = false; state.running = false;
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('pause-icon').style.display = '';
  document.getElementById('play-icon').style.display = 'none';
}
function startTimerIfNeeded() {
  if (state.running || state.finished) return;
  state.running = true; state.timerStart = Date.now();
  timerInterval = setInterval(tick, 250);
}
function elapsedMs() {
  if (!state.running || state.paused) return state.elapsedBeforePause;
  return state.elapsedBeforePause + (Date.now() - state.timerStart);
}
// Local, not window.NBTLeaderboard.formatTime() -- this is a pure
// function with no reason to depend on the leaderboard module, and it
// used to: leaderboard.js became a `type="module"` script (deferred,
// and it has to fetch the Firebase SDK from a CDN before it can even
// run) while this file is a plain classic script that runs immediately.
// tick() fires every 250ms starting the moment someone types their first
// letter -- if the module hadn't finished loading yet, this threw and
// silently broke the timer display itself, not just the leaderboard.
function formatTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60); s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function tick() { document.getElementById('timer').textContent = formatTime(elapsedMs()); }

// Locking the grid on pause is deliberate, not just pausing the clock:
// without this, entries typed while "paused" were silently accepted,
// which both defeats the point of pausing and would let elapsed time and
// grid state drift out of sync with each other.
function setLocked(locked) {
  document.querySelector('.grid-wrap').classList.toggle('locked', locked);
  ['check-toggle', 'reveal-toggle', 'clear-btn'].forEach(function (id) {
    document.getElementById(id).disabled = locked;
  });
  if (locked) closeAllDropdowns();
}

document.getElementById('pause-btn').addEventListener('click', function () {
  if (!state.running || state.finished) return;
  if (!state.paused) {
    state.elapsedBeforePause = elapsedMs(); state.paused = true;
    document.getElementById('pause-icon').style.display = 'none'; document.getElementById('play-icon').style.display = '';
  } else {
    state.paused = false; state.timerStart = Date.now();
    document.getElementById('pause-icon').style.display = ''; document.getElementById('play-icon').style.display = 'none';
  }
  setLocked(state.paused);
});

/* ------------------------------ Dropdowns ------------------------------ */
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown-menu.open').forEach(function (m) { m.classList.remove('open'); });
  document.querySelectorAll('.dropdown button[aria-expanded]').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });
}
function wireDropdown(toggleId, menuId) {
  var toggle = document.getElementById(toggleId), menu = document.getElementById(menuId);
  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    if (toggle.disabled) return;
    var willOpen = !menu.classList.contains('open');
    closeAllDropdowns();
    if (willOpen) { menu.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
  });
  menu.addEventListener('click', function (e) {
    if (e.target.tagName === 'BUTTON') closeAllDropdowns();
  });
}
wireDropdown('check-toggle', 'check-menu');
wireDropdown('reveal-toggle', 'reveal-menu');
document.addEventListener('click', closeAllDropdowns);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllDropdowns(); });

/* ---------------------------- Check actions ---------------------------- */
// Shared by all three Check granularities: mark a set of cells "wrong"
// (only where filled and incorrect) with a brief flash, same visual
// language regardless of scope.
function flashWrong(cells) {
  var solved = state.puzzle.grid;
  cells.forEach(function (rc) {
    var r = rc[0], c = rc[1];
    var v = state.values[r][c];
    var div = document.querySelector('.xcell[data-r="' + r + '"][data-c="' + c + '"]');
    if (div) div.classList.toggle('wrong', !!v && v !== solved[r][c]);
  });
  setTimeout(function () { document.querySelectorAll('.xcell.wrong').forEach(function (d) { d.classList.remove('wrong'); }); }, 1400);
}
function allCells() {
  var cells = [];
  var rows = state.puzzle.size.rows, cols = state.puzzle.size.cols;
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) if (state.puzzle.grid[r][c] !== '#') cells.push([r, c]);
  return cells;
}
document.getElementById('check-square-btn').addEventListener('click', function () {
  flashWrong([[state.sel.r, state.sel.c]]);
});
document.getElementById('check-word-btn').addEventListener('click', function () {
  var slot = currentSlot();
  if (slot) flashWrong(slot.cells);
});
document.getElementById('check-puzzle-btn').addEventListener('click', function () {
  flashWrong(allCells());
});

document.getElementById('clear-btn').addEventListener('click', function () {
  var rows = state.puzzle.size.rows, cols = state.puzzle.size.cols;
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) if (state.puzzle.grid[r][c] !== '#') state.values[r][c] = '';
  paintGrid();
});

/* ---------------------------- Reveal actions ---------------------------- */
// Any reveal marks state.usedReveal, checked by checkCompletion() below --
// a completion reached with reveal help doesn't count as a real solve.
function revealCells(cells) {
  var solved = state.puzzle.grid;
  cells.forEach(function (rc) { state.values[rc[0]][rc[1]] = solved[rc[0]][rc[1]]; });
  state.usedReveal = true;
  paintGrid();
  checkCompletion();
}
document.getElementById('reveal-square-btn').addEventListener('click', function () {
  revealCells([[state.sel.r, state.sel.c]]);
});
document.getElementById('reveal-word-btn').addEventListener('click', function () {
  var slot = currentSlot();
  if (slot) revealCells(slot.cells);
});
document.getElementById('reveal-puzzle-btn').addEventListener('click', function () {
  revealCells(allCells());
});

function checkCompletion() {
  var rows = state.puzzle.size.rows, cols = state.puzzle.size.cols;
  var solved = state.puzzle.grid;
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
    if (solved[r][c] === '#') continue;
    if (state.values[r][c] !== solved[r][c]) return;
  }
  finishPuzzle(state.usedReveal);
}

/* --------------------------- Completion modal --------------------------- */
// The "you solved it" confirmation is the core feedback and must show
// unconditionally, the instant the puzzle is done -- the leaderboard is
// a secondary, network-dependent enhancement layered on top, and a
// failure or slowness in it must never be able to block or hide the
// primary confirmation. (This was a real bug: leaderboard.js is a
// type="module" script that has to fetch the Firebase SDK from a CDN
// before it can run, while this file is a classic script that runs
// immediately -- solving fast enough, or the module failing to load at
// all, meant window.NBTLeaderboard.submitTime() threw before the modal
// was ever shown, silently.)
function finishPuzzle(viaReveal) {
  if (state.finished) return;
  state.finished = true;
  clearInterval(timerInterval);
  var ms = elapsedMs();
  var timeStr = formatTime(ms);
  var puzzleId = state.puzzle.id;
  var name = state.username || 'anon-solver';

  document.getElementById('done-heading').textContent = viaReveal ? 'Puzzle revealed' : 'Solved! 🎉';
  document.getElementById('done-time').textContent = timeStr;
  document.getElementById('done-rank').textContent = viaReveal
    ? 'Not counted toward today’s leaderboard'
    : 'Checking today’s leaderboard…';
  document.getElementById('done-lb').innerHTML = '';
  document.getElementById('done-overlay').classList.remove('hidden');

  function renderBoard(rank, board) {
    document.getElementById('done-rank').textContent =
      viaReveal ? 'Not counted toward today’s leaderboard' : ('Rank ' + rank + ' of ' + board.length + ' today');
    var lb = document.getElementById('done-lb');
    lb.innerHTML = '';
    board.slice(0, 5).forEach(function (row, i) {
      var div = document.createElement('div');
      var isMe = !viaReveal && row.name === name && row.ms === ms && (i + 1) === rank;
      div.className = 'mini-lb-row r' + (i + 1) + (isMe ? ' me' : '');
      div.innerHTML = '<span class="rk">' + (i + 1) + '</span><span>' + row.name + '</span><span class="tm">' + formatTime(row.ms) + '</span>';
      lb.appendChild(div);
    });
    if (!viaReveal && rank <= 5) {
      window.NBTConfetti.burst(window.innerWidth * 0.3, window.innerHeight * 0.35);
      window.NBTConfetti.burst(window.innerWidth * 0.7, window.innerHeight * 0.35);
    }
  }

  // window.NBTLeaderboard might not exist yet (module still loading) --
  // check explicitly rather than letting the call throw. Not an error
  // state worth alarming over: it resolves itself once the module loads,
  // this just guards the one call that might race it.
  if (!window.NBTLeaderboard) {
    document.getElementById('done-rank').textContent = 'Leaderboard unavailable right now.';
    return;
  }

  var boardPromise = viaReveal
    ? window.NBTLeaderboard.getBoard(puzzleId).then(function (board) { return { rank: board.length + 1, board: board }; })
    : window.NBTLeaderboard.submitTime(puzzleId, name, ms).then(function (rank) {
        return window.NBTLeaderboard.getBoard(puzzleId).then(function (board) { return { rank: rank, board: board }; });
      });

  boardPromise.then(function (result) {
    renderBoard(result.rank, result.board);
  }).catch(function (err) {
    console.error('[leaderboard] could not load/submit:', err);
    document.getElementById('done-rank').textContent = 'Leaderboard unavailable right now.';
  });
}

document.getElementById('done-close-x').addEventListener('click', function () {
  document.getElementById('done-overlay').classList.add('hidden');
});
document.getElementById('done-home').addEventListener('click', function () {
  window.location.href = 'index.html';
});

/* ------------------------------- Wiring ------------------------------- */
document.querySelectorAll('.switcher button').forEach(function (btn) {
  btn.addEventListener('click', function () { loadPuzzle(btn.dataset.size); });
});
window.addEventListener('resize', function () { if (state.puzzle) renderGrid(); });

document.getElementById('name-submit').addEventListener('click', submitName);
document.getElementById('name-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitName(); });
function submitName() {
  var v = document.getElementById('name-input').value.trim();
  state.username = v || 'anon-solver';
  document.getElementById('name-overlay').classList.add('hidden');
}

var initialSize = new URLSearchParams(window.location.search).get('size') || 'mini';
if (!TITLES[initialSize]) initialSize = 'mini';
loadPuzzle(initialSize);
</script>
</body>
</html>
